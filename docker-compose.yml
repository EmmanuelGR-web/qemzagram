# Servicios de desarrollo: base de datos PostgreSQL, bandeja de correo de prueba y servidor de llamadas.
# Uso:  npm run db:up   (levantar)   |   npm run db:down   (apagar)
services:
  db:
    image: postgres:16-alpine
    container_name: qemzagram-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: qemzagram
      POSTGRES_PASSWORD: qemzagram_dev
      POSTGRES_DB: qemzagram
    ports:
      - '127.0.0.1:5432:5432' # solo accesible desde tu propia PC
    volumes:
      - qemzagram-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qemzagram -d qemzagram']
      interval: 5s
      timeout: 5s
      retries: 10

  # Atrapa todos los correos que envía la app (verificación, recuperación). Verlos en http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: qemzagram-mail
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # bandeja web

  # Servidor de llamadas y videollamadas (SFU). Modo desarrollo: credenciales públicas devkey/secret,
  # por eso SOLO escucha en tu propia PC (127.0.0.1). Nunca uses --dev en producción.
  livekit:
    image: livekit/livekit-server:v1.13.10
    container_name: qemzagram-livekit
    restart: unless-stopped
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    environment:
      # Avisa a la API cuando alguien sale de una sala (por ejemplo, si cerró el navegador).
      LIVEKIT_CONFIG: |
        webhook:
          api_key: devkey
          urls:
            - http://host.docker.internal:4000/calls/livekit-webhook
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:7880:7880' # señalización (WebSocket) y API
      - '127.0.0.1:7881:7881' # medios por TCP (respaldo)
      - '127.0.0.1:7882:7882/udp' # medios por UDP

volumes:
  qemzagram-data:
