# Integración continua: en cada push a main y en cada pull request se verifica que el proyecto
# compile sin errores de tipos, que pasen TODOS los tests (con ffmpeg real) y que las
# dependencias de producción no tengan vulnerabilidades conocidas. Además se construyen y prueban las
# imágenes Docker de producción (job "imagenes"). Si algo falla, el commit queda en rojo.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      plataforma:
        description: 'Arquitectura de las imágenes Docker (arm64 = la de Oracle Cloud; se emula con QEMU y tarda bastante más)'
        type: choice
        options: [linux/amd64, linux/arm64]
        default: linux/amd64

# Mínimo privilegio: el flujo solo puede LEER el repositorio (no puede escribir, publicar ni crear releases).
permissions:
  contents: read

# Si llega un push nuevo a la misma rama, se cancela la corrida vieja (ahorra minutos gratis).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, tests, auditoría y build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # La prueba de ffmpeg real no se puede saltear en CI (comprueba que se borra el GPS de los videos).
      REQUIRE_FFMPEG: 'true'
      # Next no manda estadísticas de uso desde la CI.
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # npm ci instala EXACTAMENTE lo del package-lock.json (y falla si no coincide con package.json).
      - name: Instalar dependencias
        run: npm ci

      - name: Auditoría de dependencias (producción)
        run: npm run audit

      - name: Verificar tipos (API y web)
        run: npm run typecheck

      - name: Tests de la API
        run: npm test

      - name: Compilar todo
        run: npm run build

  # Construye las imágenes de PRODUCCIÓN (las mismas que usa deploy/docker-compose.prod.yml) y las prueba
  # de verdad: la API arranca contra un PostgreSQL real, corre las migraciones y responde /health.
  # Así un Dockerfile roto se detecta acá y no recién en el servidor (y nunca se construye en la PC).
  imagenes:
    name: Imágenes Docker (${{ inputs.plataforma || 'linux/amd64' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PLATAFORMA: ${{ inputs.plataforma || 'linux/amd64' }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Solo si se pidió arm64 a mano: QEMU emula ARM en el servidor amd64 de GitHub.
      - name: Preparar emulación ARM64
        if: env.PLATAFORMA == 'linux/arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Revisar los scripts de backup (shellcheck)
        run: shellcheck --shell=sh deploy/backup/*.sh

      # Genera un deploy/.env de prueba con secretos aleatorios descartables (el mismo script que en producción)
      # y completa los datos que en el servidor pone la persona. Después valida el compose completo.
      - name: Validar docker-compose.prod.yml
        run: |
          node scripts/setup-env.mjs --produccion
          sed -i \
            -e 's|^DOMAIN=.*|DOMAIN=qemzagram.example.com|' \
            -e 's|^ACME_EMAIL=.*|ACME_EMAIL=ci@example.com|' \
            -e 's|^BACKUP_AGE_RECIPIENT=.*|BACKUP_AGE_RECIPIENT=age1ql3z7hjy54pw3hyww5ayyfg7zqgvc7w3j2elw8zmrj2kg5sfn9aqmcac8p|' \
            -e 's|^BACKUP_S3_BUCKET=.*|BACKUP_S3_BUCKET=qemzagram-ci|' \
            deploy/.env
          docker compose -f deploy/docker-compose.prod.yml config --quiet

      - name: Construir la imagen de la API
        run: docker build --platform "$PLATAFORMA" -f apps/api/Dockerfile -t qemzagram-api:ci .

      - name: Construir la imagen de la web
        run: >-
          docker build --platform "$PLATAFORMA" -f apps/web/Dockerfile -t qemzagram-web:ci
          --build-arg PUBLIC_URL=https://qemzagram.example.com
          --build-arg LIVEKIT_PUBLIC_URL=wss://livekit.qemzagram.example.com .

      - name: Construir la imagen de backups
        run: docker build --platform "$PLATAFORMA" -t qemzagram-backup:ci deploy/backup

      - name: Las imágenes corren SIN root
        run: |
          for imagen in qemzagram-api:ci qemzagram-web:ci; do
            usuario=$(docker run --rm --platform "$PLATAFORMA" --entrypoint id "$imagen" -u)
            echo "$imagen corre con uid $usuario"
            [ "$usuario" != "0" ] || { echo "::error::$imagen corre como root"; exit 1; }
          done

      - name: Prueba de humo (API + PostgreSQL + web)
        run: |
          docker network create qz-ci
          docker run -d --name db --network qz-ci \
            -e POSTGRES_USER=qemzagram -e POSTGRES_PASSWORD=ci-solo-prueba -e POSTGRES_DB=qemzagram \
            postgres:16-alpine
          # Primero la base tiene que aceptar conexiones (como el "depends_on: service_healthy" del compose).
          for intento in $(seq 1 30); do
            docker exec db pg_isready -U qemzagram -d qemzagram >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec db pg_isready -U qemzagram -d qemzagram
          docker run -d --name api --network qz-ci --platform "$PLATAFORMA" \
            -e DATABASE_URL=postgres://qemzagram:ci-solo-prueba@db:5432/qemzagram \
            -e WEB_ORIGIN=https://qemzagram.example.com \
            -e JWT_ACCESS_SECRET="$(openssl rand -hex 32)" \
            -e JWT_TICKET_SECRET="$(openssl rand -hex 32)" \
            -e PASSWORD_PEPPER="$(openssl rand -hex 24)" \
            -e MESSAGE_ENC_KEY="$(openssl rand -base64 32)" \
            -e CLAMAV_HOST=clamav \
            -e RUN_MIGRATIONS=true \
            -p 4000:4000 qemzagram-api:ci
          docker run -d --name web --network qz-ci --platform "$PLATAFORMA" -p 3000:3000 qemzagram-web:ci

          # Espera hasta 5 minutos a que responda (con emulación ARM todo tarda bastante más).
          esperar() {
            for intento in $(seq 1 60); do
              if curl -fsS "$1" >/dev/null 2>&1; then echo "OK: $1"; return 0; fi
              sleep 5
            done
            echo "::error::No respondió $1"; return 1
          }
          esperar http://127.0.0.1:4000/health
          curl -fsS http://127.0.0.1:4000/health | grep -q '"status":"ok"'
          esperar http://127.0.0.1:3000/manifest.webmanifest
          # La web hace de proxy hacia la API: /api/health tiene que llegar a la API real.
          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"status":"ok"'

      - name: Logs de los contenedores (si algo falló)
        if: failure()
        run: |
          for c in db api web; do echo "===== $c ====="; docker logs "$c" 2>&1 | tail -n 80 || true; done
