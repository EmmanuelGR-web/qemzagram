# Dependabot revisa cada semana si hay versiones nuevas y abre pull requests (que pasan por la CI).
# Las actualizaciones de SEGURIDAD llegan apenas se publican, sin esperar al lunes.
# Las menores y de parche se agrupan en un solo PR para no llenar el repositorio de avisos.
version: 2
updates:
  # Paquetes de npm de todo el monorepo (un solo package-lock.json en la raíz).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Argentina/Tucuman
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'Dependencias'
    groups:
      # NestJS se actualiza TODO junto: mezclar versiones mayores (p. ej. common 12 con core 11) instala dos
      # copias de Nest y rompe la inyección de dependencias. Va primero para que gane sobre "menores".
      nestjs:
        patterns: ['@nestjs/*']
      menores:
        update-types: [minor, patch]
    ignore:
      # Los tipos de Node tienen que coincidir con el Node de producción (24, en los Dockerfiles y la CI):
      # con tipos más nuevos se podrían usar funciones que en el servidor no existen.
      # Al cambiar la versión de Node, subí @types/node a mano.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # Las propias acciones de GitHub usadas en la CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'CI'
